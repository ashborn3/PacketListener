<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Network Packet Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #38bdf8;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #1e293b;
    }
    tr:nth-child(even) {
      background: #1e293b;
    }
    tr.new-row {
      animation: fadeIn 1s ease-in-out;
      background-color: #166534 !important;
    }
    @keyframes fadeIn {
      from { background-color: #22c55e; }
      to { background-color: #166534; }
    }
  </style>
</head>
<body>
  <h1>Live Packet Log</h1>
  <table id="packetTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Source IP</th>
        <th>Destination IP</th>
        <th>Source MAC</th>
        <th>Destination MAC</th>
        <th>Source Port</th>
        <th>Destination Port</th>
        <th>Protocol</th>
        <th>Payload</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    let lastSeenId = null;

    async function fetchPackets() {
      try {
        const res = await fetch('/data?limit=100&offset=0');
        const records = await res.json();

        const tbody = document.querySelector('#packetTable tbody');
        tbody.innerHTML = ''; // clear current rows

        for (let record of records) {
          const row = document.createElement('tr');
          if (lastSeenId && record.id > lastSeenId) {
            row.classList.add('new-row');
          }

          row.innerHTML = `
            <td>${record.id}</td>
            <td>${record.source_ip}</td>
            <td>${record.dest_ip}</td>
            <td>${record.source_mac}</td>
            <td>${record.dest_mac}</td>
            <td>${record.source_port}</td>
            <td>${record.dest_port}</td>
            <td>${record.protocol}</td>
            <td>${record.payload}</td>
          `;
          tbody.appendChild(row);
        }

        if (records.length > 0) {
          lastSeenId = records[0].id; // highest ID
        }

      } catch (err) {
        console.error('Failed to fetch packet data:', err);
      }
    }

    // Initial load
    fetchPackets();

    // Refresh every 5 seconds
    setInterval(fetchPackets, 1000);
  </script>
</body>
</html>
